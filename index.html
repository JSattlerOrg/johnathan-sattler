<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Johnathan Sattler</title>
  <meta name="description" content="The personal website of Johnathan Sattler — designed like a tiny operating system.">
  <meta name="theme-color" content="#0b0b14">
  <meta name="color-scheme" content="light dark">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Johnathan Sattler">
  <meta property="og:description" content="The personal website of Johnathan Sattler — designed like a tiny operating system.">
  <meta property="og:url" content="https://resume.johnathansattler.com/">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Johnathan">
  <link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    // Apply saved preferences before first paint to avoid a flash.
    (function () {
      var d = document.documentElement;
      try {
        var t = JSON.parse(localStorage.getItem("jsos:theme") || '"auto"');
        var w = JSON.parse(localStorage.getItem("jsos:wallpaper") || '"aurora"');
        var r = JSON.parse(localStorage.getItem("jsos:reduceMotion") || "false");
        d.dataset.theme = t; d.dataset.wallpaper = w;
        if (r) d.classList.add("reduce-motion");
      } catch (e) { d.dataset.theme = "auto"; d.dataset.wallpaper = "aurora"; }
      try {
        if (location.hash.indexOf("#/") === 0 || sessionStorage.getItem("jsos:unlocked") === "1") d.classList.add("no-lock");
        else d.classList.add("locked");
      } catch (e) { d.classList.add("locked"); }
    })();
  </script>
  <script src="assets/js/content.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</head>
<body>
  <div class="wallpaper" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span>
    <span class="grain"></span>
  </div>

  <header class="status-bar" id="statusBar" aria-hidden="true">
    <div class="sb-left"><span class="sb-time" data-clock="short">9:41</span><span class="sb-date" data-clock="ipad-date"></span></div>
    <div class="sb-island"></div>
    <div class="sb-right">
      <svg class="sb-signal" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg class="sb-wifi" viewBox="0 0 16 12"><path d="M1.6 4.4a9.2 9.2 0 0 1 12.8 0M4.2 7.1a5.5 5.5 0 0 1 7.6 0"/><circle cx="8" cy="10" r="1.6"/></svg>
      <span class="sb-battery"><span class="sb-battery-level" id="batteryLevel"></span></span>
    </div>
  </header>

  <!-- Home screen -->
  <main class="home" id="home" aria-label="Home screen">
    <h1 class="visually-hidden">Johnathan Sattler</h1>
    <div class="pages" id="pages" tabindex="-1"></div>
    <div class="page-dots" id="dots" role="tablist" aria-label="Home screen pages"></div>
    <button class="search-pill" id="searchPill" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
      <span>Search</span>
    </button>
    <nav class="dock" id="dock" aria-label="Dock"></nav>
  </main>

  <!-- Lock screen -->
  <section class="lock" id="lock" aria-label="Lock screen">
    <div class="lock-top">
      <svg class="lock-padlock" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
      <div class="lock-date" data-clock="long-date"></div>
      <div class="lock-time" data-clock="lock"></div>
    </div>
    <div class="lock-notifs" id="lockNotifs"></div>
    <div class="lock-bottom">
      <button class="lock-cta" id="unlockBtn" type="button">
        <span class="lock-cta-text">Swipe up or tap to open</span>
        <span class="home-bar"></span>
      </button>
    </div>
  </section>

  <!-- App window -->
  <div class="app-backdrop" id="backdrop" hidden></div>
  <section class="app" id="app" role="dialog" aria-modal="true" aria-labelledby="appTitle" hidden>
    <div class="app-content" id="appContent"></div>
    <button class="home-indicator" id="homeIndicator" type="button" aria-label="Close app"><span></span></button>
  </section>

  <!-- Spotlight search -->
  <div class="spotlight" id="spotlight" role="dialog" aria-modal="true" aria-label="Search" hidden>
    <div class="spotlight-panel">
      <label class="spotlight-field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
        <input id="spotlightInput" type="search" placeholder="Search apps, projects, notes…" autocomplete="off" spellcheck="false" aria-label="Search">
        <button type="button" class="spotlight-cancel" id="spotlightCancel">Cancel</button>
      </label>
      <div class="spotlight-results" id="spotlightResults" role="listbox"></div>
    </div>
  </div>

  <!-- Notification banner -->
  <div class="banner" id="banner" role="status" aria-live="polite" hidden></div>

  <noscript>
    <div class="noscript">
      <h1>Johnathan Sattler</h1>
      <p>This site is an interactive, phone-style experience and needs JavaScript.</p>
      <p><a href="https://github.com/JohnathanSattler">GitHub</a></p>
    </div>
  </noscript>
</body>
</html>
